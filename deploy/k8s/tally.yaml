apiVersion: v1
kind: Service
metadata:
  name: tally
  namespace: tally
spec:
  selector:
    app: tally
  ports:
    - port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tally
  namespace: tally
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tally
  template:
    metadata:
      labels:
        app: tally
    spec:
      containers:
        - name: tally
          image: tally:local
          imagePullPolicy: Never
          env:
            - name: DATABASE_URL
              value: postgres://tally:tally@postgres:5432/tally
            - name: REDIS_ADDR
              value: redis:6379
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 256Mi
